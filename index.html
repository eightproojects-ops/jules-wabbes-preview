<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jules Wabbes — Belgian furniture designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* Brand display font — served from the live Jules Wabbes site */
  @font-face{
    font-family:'Compacta';
    src:url('https://jules-wabbes.redsheep.be/wp-content/uploads/2026/06/unicode.compacta.woff2') format('woff2'),
        url('https://jules-wabbes.redsheep.be/wp-content/uploads/2026/06/unicode.compacta.woff') format('woff'),
        url('https://jules-wabbes.redsheep.be/wp-content/uploads/2026/06/CompactaLetPlain.ttf') format('truetype');
    font-weight:400;font-style:normal;font-display:swap;
  }
  @font-face{
    font-family:'CompactaLetPlain';
    src:url('https://jules-wabbes.redsheep.be/wp-content/uploads/2026/06/CompactaLetPlain.ttf') format('truetype');
    font-weight:400;font-style:normal;font-display:swap;
  }
  :root{
    --bg:#FFFFFF; --ink:#000000; --muted:#111111; --muted2:#9A9A9A;
    --body:#111111; --brass:#000000; --hover:#5E5E5E; --neutral:#ECECEC; --neutral2:#E8E8E8; --neutral3:#E2E2E2;
    --hatch-light:repeating-linear-gradient(135deg,transparent,transparent 12px,rgba(0,0,0,0.05) 12px,rgba(0,0,0,0.05) 13px);
    --hatch-dark:repeating-linear-gradient(135deg,transparent,transparent 13px,rgba(255,255,255,0.06) 13px,rgba(255,255,255,0.06) 14px);
  }
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--body);font-family:'Courier Prime',monospace;line-height:1.6;letter-spacing:0.4px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  *{box-sizing:border-box}
  input,textarea,button,select{font-family:'Courier Prime',monospace}
  ::placeholder{color:var(--muted2)}
  h1,h2{font-family:'CompactaLetPlain','Compacta',sans-serif;font-weight:400;text-transform:uppercase}
  /* Long-form reading text — Courier Prime, matching the live site */
  .prose{font-family:'Courier Prime',monospace;font-size:15px;line-height:1.8;letter-spacing:0.6px;color:var(--body)}
  .ph{display:flex;align-items:flex-end;background-color:var(--neutral);background-image:var(--hatch-light)}
  .ph span{font-family:'Courier Prime',monospace;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted)}
  .lnk{cursor:pointer}
  .lnk:hover{color:var(--hover)}
  .btn-fill{background:var(--ink);color:var(--bg);border:1px solid var(--ink);cursor:pointer;transition:background .2s,border-color .2s}
  .btn-fill:hover{background:var(--hover);border-color:var(--hover)}
  .btn-out{background:transparent;color:var(--ink);border:1px solid var(--ink);cursor:pointer;transition:background .2s,color .2s}
  .btn-out:hover{background:#000;color:#fff;border-color:#000}
  .btn-ghost{background:transparent;border:none;cursor:pointer;color:var(--ink);transition:color .2s}
  .btn-ghost:hover{color:var(--hover)}
  .card{cursor:pointer}
  .card .name{transition:color .2s}
  .card:hover .name{color:var(--hover)!important}
  .card .arrow{transition:transform .2s}
  .card:hover .arrow{transform:translateX(4px)}
  /* Accordion (dérouler) */
  .acc{border-top:1px solid #111111}
  .acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;
    padding:18px 0;font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink)}
  .acc summary::-webkit-details-marker{display:none}
  .acc summary::after{content:'+';font-family:'Courier Prime',monospace;font-size:18px;color:var(--ink);transition:transform .2s}
  .acc[open] summary::after{content:'–'}
  .acc summary:hover{color:var(--hover)}
  .acc-flush > .acc{border-top:none}
  /* Section accordion (chevron) — collapsible list under a sectionBar-style heading */
  .sec-acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;
    padding:26px 48px;border-bottom:1px solid #000000}
  .sec-acc summary::-webkit-details-marker{display:none}
  .sec-acc summary .chev{flex:none;margin-left:24px;transition:transform .25s ease}
  .sec-acc[open] summary .chev{transform:rotate(180deg)}
  .sec-acc summary:hover .chev{opacity:0.6}
  .spec-table > div:last-child{border-bottom:none!important}
  .rel-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid #000;border-left:1px solid #000;border-right:1px solid #000}
  .rel-grid > *{border-right:1px solid #000;border-bottom:1px solid #000}
  .rel-grid > *:nth-child(4n){border-right:none}
  .rel-grid .cell-foot{min-height:56px;align-items:center}
  @media(max-width:860px){ .rel-grid{grid-template-columns:1fr 1fr} }
  @media(max-width:560px){ .rel-grid{grid-template-columns:1fr} }
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #000;border-left:1px solid #000}
  .cat-grid > *{border-right:1px solid #000;border-bottom:1px solid #000}
  @media(max-width:820px){ .cat-grid{grid-template-columns:1fr} }
  .acc .acc-body{padding:0 0 26px}
  /* Collection grid — full-width framed catalogue (shared black grid lines) */
  .col-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
  .col-grid > *{border-right:1px solid #000;border-bottom:1px solid #000}
  .col-grid > *:nth-child(4n){border-right:none}
  .cell{display:flex;flex-direction:column}
  .cell .cell-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 18px;border-top:1px solid #000;margin-top:auto}
  .col-grid .cell-foot{min-height:60px;align-items:center}
  .cell .arrow{font-size:18px;color:#000;transition:transform .2s}
  .cell:hover .arrow{transform:translateX(4px)}
  .cat-tab{position:absolute;top:14px;right:14px;font-family:'Courier Prime',monospace;font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:#000;background:#fff;border:1px solid #000;padding:6px 11px}
  .corner-tab{position:absolute;top:14px;left:14px;font-family:'Courier Prime',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:#000;background:#fff;border:1px solid #000;padding:6px 11px}
  .j-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:36px}
  /* Toast */
  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--bg);font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:0.08em;
    padding:14px 22px;transition:opacity .25s,transform .25s;z-index:80;max-width:90vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* Header dropdowns */
  .navitem{position:relative}
  .navlabel{font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#000;padding:15px 0;cursor:pointer}
  .dd{position:absolute;top:100%;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #000;display:none;z-index:40;min-width:210px}
  .navitem:hover .dd{display:block}
  .dd .ditem{display:block;padding:13px 22px;font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#000;white-space:nowrap;cursor:pointer;transition:background .15s,color .15s}
  .dd .ditem:hover{background:#000;color:#fff}
  .dd.mega{left:0;transform:none;min-width:0;border:none;background:transparent}
  .navitem:hover .dd.mega{display:block}
  .mega-wrap{position:relative}
  .mega-left{display:flex;flex-direction:column;width:200px;background:#fff;border:1px solid #000}
  .megacat{padding:14px 22px;font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#000;cursor:pointer;transition:background .15s,color .15s}
  .megacat:hover{background:#000;color:#fff}
  .subpanel{position:absolute;top:0;left:100%;display:none;flex-direction:column;padding:6px 0;min-width:200px;background:#fff;border:1px solid #000;border-left:none}
  /* a sub-panel (sub-sub-menu) appears ONLY when its category is hovered (or the panel itself) */
  .mega-wrap:has(.c-lighting:hover) .s-lighting,.mega-wrap:has(.s-lighting:hover) .s-lighting,
  .mega-wrap:has(.c-furniture:hover) .s-furniture,.mega-wrap:has(.s-furniture:hover) .s-furniture,
  .mega-wrap:has(.c-accessories:hover) .s-accessories,.mega-wrap:has(.s-accessories:hover) .s-accessories{display:flex}
  /* keep the hovered category highlighted while on its sub-panel */
  .mega-wrap:has(.s-lighting:hover) .c-lighting,.mega-wrap:has(.s-furniture:hover) .c-furniture,.mega-wrap:has(.s-accessories:hover) .c-accessories{background:#000;color:#fff}
  @media(max-width:860px){ .dd,.dd.mega{display:none!important} }
  /* ---------- Responsive ---------- */
  @media(max-width:860px){
    .row-split,.row-2,.row-3,.row-4,.cats,.projects,.footer-cols{flex-direction:column!important}
    .row-split>*,.row-2>*,.row-3>*,.row-4>*,.cats>*,.projects>*{flex:1 1 100%!important;border-right:none!important}
    .cats>*{border-bottom:1px solid var(--ink)}
    .pad-x{padding-left:22px!important;padding-right:22px!important}
    .pad-block{padding-left:22px!important;padding-right:22px!important}
    h1{font-size:26px!important}
    h2{font-size:26px!important}
    .nav{gap:16px!important;flex-wrap:wrap;justify-content:flex-start!important}
    .search{display:none!important}
    .col-grid{grid-template-columns:1fr 1fr}
    .col-grid > *{border-right:1px solid #000}
    .col-grid > *:nth-child(4n){border-right:1px solid #000}
    .col-grid > *:nth-child(2n){border-right:none}
    .j-grid{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    .col-grid{grid-template-columns:1fr}
    .col-grid > *{border-right:none!important}
  }
  /* Exhibitions grids — framed, shared black lines (top+left on wrap, right+bottom on cells) */
  .exh-spaces,.exh-past{display:grid;gap:0;max-width:1140px;margin:0 auto;border-top:1px solid #000;border-left:1px solid #000}
  .exh-spaces > *,.exh-past > *{border-right:1px solid #000;border-bottom:1px solid #000}
  .exh-spaces{grid-template-columns:1fr 1fr}
  .exh-past{grid-template-columns:repeat(3,1fr)}
  @media(max-width:860px){ .exh-past{grid-template-columns:1fr 1fr} }
  @media(max-width:560px){ .exh-spaces,.exh-past{grid-template-columns:1fr} }
  /* Auction results table */
  .auc-table{border-top:1px solid #000}
  .auc-row{display:grid;grid-template-columns:2.4fr 2fr 1.2fr 1fr;gap:18px;align-items:center;
    padding:15px 4px;border-bottom:1px solid #E2E2E2;font-size:13px}
  /* Press — all press boxed accordions */
  .press-box{border:1px solid #000!important;padding:2px 20px;margin-bottom:12px}
  .press-box > summary{padding:18px 0}
  .press-more{margin-top:6px}
  .press-more > summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
    border:1px solid #000;padding:14px 30px;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:#000;transition:background .15s,color .15s}
  .press-more > summary::-webkit-details-marker{display:none}
  .press-more > summary::after{content:'  +';margin-left:6px}
  .press-more[open] > summary::after{content:'  –'}
  .press-more > summary:hover{background:#000;color:#fff}
  /* Press featured — expandable cards */
  .press-card{display:flex;flex-direction:column}
  .press-card > summary{list-style:none;cursor:pointer;display:flex;flex-direction:column}
  .press-card > summary::-webkit-details-marker{display:none}
  .press-card .ptog::after{content:'  +'}
  .press-card[open] .ptog::after{content:'  –'}
  .press-card[open] .ptog{color:#000000}
  .press-card > summary:hover .ptog{color:#000000}
  .press-table .auc-row{grid-template-columns:1fr auto}
  @media(max-width:680px){ .press-table .auc-row{grid-template-columns:1fr auto;row-gap:0} .press-table .auc-head{display:grid} }
  .auc-row.card{cursor:pointer;transition:background .15s}
  .auc-row.card:hover{background:#F5F5F5}
  .auc-head{border-bottom:1px solid #000;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#9A9A9A}
  .auc-head > *{font-weight:400!important}
  @media(max-width:680px){
    .auc-row{grid-template-columns:1fr auto;gap:4px 14px;row-gap:2px;padding:16px 4px}
    .auc-row > *:nth-child(1){grid-column:1;font-weight:700}
    .auc-row > *:nth-child(4){grid-column:2;grid-row:1 / span 3;align-self:center}
    .auc-row > *:nth-child(2){grid-column:1;color:#9A9A9A!important;font-size:11px}
    .auc-row > *:nth-child(3){grid-column:1;color:#9A9A9A!important;font-size:11px}
    .auc-head{display:none}
  }
  /* Catalogue cover — real CSS 3D book mockup: front cover + page edge + base, no scene/background */
  .book-wrap{perspective:1400px}
  .book3d{position:relative;transform-style:preserve-3d;transform:rotateY(-26deg) rotateX(2deg);transition:transform .35s ease}
  .book-wrap:hover .book3d{transform:rotateY(-16deg) rotateX(2deg)}
  .book3d img{display:block;width:100%;height:auto;position:relative;z-index:2;box-shadow:0 22px 34px -14px rgba(0,0,0,.45)}
  .book3d::before{ /* page edge, right side */
    content:'';position:absolute;top:3px;bottom:3px;right:-13px;width:13px;
    background:repeating-linear-gradient(90deg,#f2f0e8 0 1px,#ffffff 1px 2px,#e4e0d2 2px 3px);
    transform:rotateY(90deg);transform-origin:left center;
    box-shadow:inset -3px 0 6px rgba(0,0,0,.18)}
  .book3d::after{ /* base edge, bottom — implies thickness/weight */
    content:'';position:absolute;left:3px;right:-11px;bottom:-9px;height:9px;
    background:#dcd8ca;transform:rotateX(-90deg);transform-origin:top}
  .book-shadow{width:78%;height:16px;margin:14px auto 0;border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(0,0,0,.28) 0%,rgba(0,0,0,0) 72%);filter:blur(1px)}
  .book-shadow.on-dark{background:radial-gradient(ellipse at center,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 72%)}
</style>
</head>

   body:[

const state = { page:'home', ap:0, finish:0, details:false, news:'exhibitions', project:'pavilion', filter:'ALL', sub:'ALL FURNITURE', storyTab:0, contactTab:0 };
function setState(patch, keepScroll){ Object.assign(state, patch); render(); if(!keepScroll) window.scrollTo(0,0); }
function go(p){ setState({page:p}); }
function goCat(f){ setState({page:'collection', filter:f, sub:firstSub(f)}); }
function open(i){ setState({page:'product', ap:i, finish:0, details:false}); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }

/* accordion helper (native <details>, survives without re-render) */

}

function header(){
  const active = pg => (state.page===pg) || (pg==='story' && state.page==='storyFull') || (pg==='collection' && state.page==='product');
  const label = (text,pg)=>`<div class="navlabel" data-go="${pg}" style="border-bottom:1px solid ${active(pg)?'#000000':'transparent'}">${text}</div>`;
  const di = (text,attr)=>`<div class="ditem" ${attr}>${text}</div>`;

  // COLLECTION mega menu (categories + their sub-categories)
  const MEGA = [
    ['LIGHTING','lighting',['TABLE LAMPS','WALL LIGHTS','CEILING LIGHTS','OUTDOOR']],
    ['FURNITURE','furniture',['TABLES','SEATING','STORAGE']],
    ['HANDLES','handles',[]],
    ['ACCESSORIES','accessories',['DECORATIVE OBJECTS','COAT RACKS']]
  ];
  const megaLeft = MEGA.map(([C,slug])=>`<div class="megacat c-${slug}" data-cat="${C}">${C}</div>`).join('');
  const megaPanels = MEGA.filter(m=>m[2].length).map(([C,slug,subs])=>
    `<div class="subpanel s-${slug}">${subs.map(s=>di(s,`data-catsub="${C}|${s}"`)).join('')}</div>`).join('');
  const megaDD = `<div class="dd mega"><div class="mega-wrap"><div class="mega-left">${megaLeft}</div>${megaPanels}</div></div>`;

  const storyDD = `<div class="dd">${
    ['JULES WABBES','GENERAL DECORATION','CAROLINE & VINCENT COLET','CRAFTMANSHIP','NEWS']
      .map((t,i)=>di(t,`data-storynav="${i}"`)).join('')}</div>`;
  const journalDD = `<div class="dd">${
    ['PAVILION OF HUMAN PASSIONS','VILLA ARCA','STRONGROOM','50TH ANNIVERSARY']
      .map(t=>di(t,`data-go="journal"`)).join('')}</div>`;
  const resourcesDD = `<div class="dd">${['CATALOGUES','3D FILES'].map(t=>di(t,`data-go="resources"`)).join('')}</div>`;
  const contactDD = `<div class="dd">${['WRITE TO US','SHOWROOM','EXPERT ASSESSMENT','RESTORATION','NEWSLETTER'].map(t=>di(t,`data-go="contact"`)).join('')}</div>`;

  const nav = `
    <div class="navitem">${label('COLLECTION','collection')}${megaDD}</div>
    <div class="navitem">${label('OUR STORY','story')}${storyDD}</div>
    <div class="navitem">${label('JOURNAL','journal')}${journalDD}</div>
    <div class="navitem">${label('RESOURCES','resources')}${resourcesDD}</div>
    <div class="navitem">${label('CONTACT','contact')}${contactDD}</div>`;
  return `
  <header style="position:sticky;top:0;z-index:30;background:#FFFFFF;border-bottom:1px solid #000000">
    <div style="max-width:1140px;margin:0 auto;padding:0 40px" class="pad-x">
      <div style="display:flex;justify-content:center;align-items:center;padding:26px 0 8px">
        <div data-go="home" style="font-family:'CompactaLetPlain','Compacta',sans-serif;font-size:48px;line-height:1;letter-spacing:0.01em;color:#000000;cursor:pointer;text-align:center">Jules Wabbes</div>
      </div>
      <nav class="nav" style="display:flex;justify-content:center;gap:44px">${nav}</nav>
    </div>
  </header>`;
}

  const finSel = multiFin ? `

  const related = PRODUCTS.map((p,i)=>({...p,idx:i})).filter(p=>p.idx!==state.ap).slice(0,4).map(p=>{
    const rdark = p.signature;
    return `

        <span class="cat-tab"${rdark?' style="background:#000;color:#fff;border-color:#fff"':''}>${p.sub||p.cat}</span>

      <span class="lnk" data-go="collection" style="font-size:11px;letter-spacing:0.18em;font-weight:700;text-transform:uppercase;color:#111111;border-bottom:1px solid #111111;padding-bottom:3px">← Back to the collection</span>

          <span class="lnk" ${ap.sub?`data-catsub="${ap.cat}|${ap.sub}"`:`data-cat="${ap.cat}"`} style="display:inline-block">${ap.cat}${ap.sub?' · '+ap.sub:''}</span>${ap.featured?' · Featured':''}
        </div>
        <h1 style="font-size:42px;line-height:1.08;margin:0 0 4px;letter-spacing:-0.01em">${ap.name}</h1>
        <div style="font-family:'CompactaLetPlain','Compacta',sans-serif;font-size:22px;margin-bottom:28px">${ap.price||'On request'}</div>
        ${state.details?'':`<p class="prose" style="font-size:13px;line-height:1.7;margin:0 0 32px;max-width:440px">${ap.desc}</p>${finSel}`}
        <div style="display:flex;gap:14px;margin-top:${state.details?'0':'36px'};margin-bottom:8px">
          <button class="btn-out" data-action="enquire" style="flex:1;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;padding:16px">ENQUIRE</button>

      <h1 style="font-size:40px;line-height:1.1;margin:0 0 40px;letter-spacing:-0.01em">Biography, career and lasting influence.</h1>

      ${P('Jules Wabbes is one of the leading Belgian furniture designers and interior architects of the post-war period. He first opened an antiques and decoration shop in Brussels before starting to create his own furniture and objects.')}
      ${P('In cooperation with architect André Jacqmain, he was able to perfect his office furniture and accessories into large-scale interior design and architecture commissions for banks and office spaces such as the Foncolin Building, the Glaverbel quarters or the Générale de Banque and its strongroom. He was known for his office desks, tables and cabinets crafted from precious and exotic woods on elegant frames of stainless steel. His attention to every detail led him to create a collection of metal accessories to fit into these interiors.')}

      ${P('Wabbes was awarded several prizes, notably in 1957 and 1960 at the Milan Triennial.')}

      ${H('Established in 1969 by Jules Wabbes')}
      ${P('It was then, in 1969, that he founded General Decoration in Brussels — a company dedicated to manufacturing and retailing metal accessories exclusively designed by Jules Wabbes, run entirely on his own uncompromising standards. This set of elegant and functional objects, essential to any interior, was designed throughout his career as part of a vision for interiors conceived as a refined and coherent ensemble. The only thing that mattered to him was the sincere expression of quality in every detail.')}
      ${P('The level of craftsmanship and the use of the very best materials are the genuine signature of Jules Wabbes. Each General Decoration accessory is handmade in metal – bronze, brass or steel – all materials favoured by Wabbes for their resistance and nobility.')}

      ${P('We are still producing each of his objects using the exact same materials he used, crafted in small quantities by artisans in Belgium. When applicable, the object is stamped to certify its authenticity. Each object comes with an official certificate of authenticity, signed by Marie Wabbes (rights holder) and Vincent Colet (editor of the Wabbes collection).')}

      ${H("Wabbes' family heritage")}
      ${P('After the passing of Jules Wabbes, General Decoration has never ceased to exist, for Jules Wabbes’ spouse took over and had some objects produced while keeping all intellectual property.')}
      ${P('In 2013, Vincent Colet — antiquarian, expert and editor of objects — together with the Wabbes family, and particularly with Marie Ferran-Wabbes — Jules Wabbes’ daughter and art historian — decided to reinvigorate General Decoration with the ideals and spirit of its beginnings.')}

      ${H('Timeless heritage')}
      ${P('Jules Wabbes remained deeply influenced by his first vocation as an antiquarian, which shaped his classical approach to interiors and architectural details. He was captivated by forms conceived to stand the test of time. His work embodies pure quality, expressed through the thoughtful use and harmonious combination of exceptional materials.')}
      ${P('Today, General Decoration upholds the same standards of excellence envisioned by its founder. Each piece is crafted as an authentic expression of timeless design — made to last, and to be passed down from one generation to the next.')}

        <p style="font-size:15px;line-height:1.8;letter-spacing:0.6px;margin:0 0 36px;max-width:440px;color:#111111">${intro}</p>
        <div style="display:flex;flex-direction:column;gap:26px">
          ${fields.map(f=>field(f)).join('')}${field('MESSAGE',true)}
          <button data-action="send" style="align-self:flex-start;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;padding:16px 36px;margin-top:8px;background:#000000;color:#FFFFFF;border:1px solid #000000;cursor:pointer">SEND MESSAGE</button>
        </div>
      </div>
      <div style="flex:0 0 38%">
        <div style="font-family:'CompactaLetPlain','Compacta',sans-serif;font-size:19px;letter-spacing:0.02em;text-transform:uppercase;color:#000000;border-top:1px solid #000000;padding-top:20px">SHOWROOM</div>
        <p class="prose" style="font-size:15px;margin:14px 0 16px">5, Place Georges Brugmann<br/>1050 Brussels — by appointment only</p>
        <details class="acc" style="border-top:none;margin-bottom:30px">
          <summary style="border:1px solid #000000;padding:12px 16px">See the map</summary>
          <div class="acc-body" style="padding-top:14px">
            <div class="ph" style="aspect-ratio:3/2;background-color:#ECECEC;padding:14px"><span style="font-size:9px">MAP — PLACE GEORGES BRUGMANN</span></div>
          </div>
        </details>
        ${sideBlock('GENERAL ENQUIRIES','info@juleswabbes.com<br/>+32 2 633 11 73')}
        ${sideBlock('EXPERT ASSESSMENT','Authentication and valuation of original Wabbes pieces, quote on request.<br/>Marie Wabbes<br/>marieferranwabbes@gmail.com')}
        ${sideBlock('RESTORATION','Restoration of brass, bronze and wengé.<br/>Olivier Delroisse — Art Restauration<br/>art-restauration@skynet.be<br/><span style="white-space:nowrap">+32 498 45 07 24</span>')}
        ${sideBlock('GENERAL DECORATION SPRL','20, Route de Beaumont, 1380 Lasne <span style="white-space:nowrap">(no visits)</span><br/>VAT BE 0406 818 394')}

    <div style="background:#FFFFFF;color:#000000;border:1px solid #000000;margin-top:90px;padding:48px 56px 64px">

/* ============================================================
   RENDER + EVENTS
   ============================================================ */
const PAGES = { home:pageHome, collection:pageCollection, product:pageProduct, story:pageStory, storyFull:pageStoryFull, news:pageNews, journal:pageJournal, project:pageProject, colet:pageColet, resources:pageResources, contact:pageContact };
function render(){
  document.getElementById('app').innerHTML =
    header() + '<main>' + (PAGES[state.page]||pageHome)() + '</main>' + footer();
}
const ACTIONS = {
  enquire(){ go('contact'); },
  download(){ toast('We will email this document to you at info@juleswabbes.com'); },
  request(){ toast('Request received — we will be in touch at info@juleswabbes.com'); },
  send(){ toast('Thank you — your message has been sent.'); },
  subscribe(){ toast('Subscribed — thank you.'); }
};
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-go],[data-cat],[data-catsub],[data-open],[data-filter],[data-sub],[data-storytab],[data-storynav],[data-contacttab],[data-finish],[data-finishstep],[data-detailstoggle],[data-news],[data-project],[data-action],[data-href]');
  if(!t) return;
  if(t.dataset.href!==undefined){ window.open(t.dataset.href,'_blank','noopener'); return; }
  if(t.dataset.action!==undefined){ (ACTIONS[t.dataset.action]||(()=>{}))(); return; }
  if(t.dataset.go!==undefined) return go(t.dataset.go);
  if(t.dataset.cat!==undefined) return goCat(t.dataset.cat);
  if(t.dataset.open!==undefined) return open(+t.dataset.open);
  if(t.dataset.finish!==undefined) return setState({finish:+t.dataset.finish}, true);
  if(t.dataset.finishstep!==undefined){ const n=(PRODUCTS[state.ap].finishes||[]).length||1; return setState({finish:(state.finish + (+t.dataset.finishstep) + n)%n}, true); }
  if(t.dataset.detailstoggle!==undefined) return setState({details:!state.details}, true);
  if(t.dataset.catsub!==undefined){ const [c,s]=t.dataset.catsub.split('|'); return setState({page:'collection',filter:c,sub:s}); }
  if(t.dataset.storynav!==undefined){
    const i=+t.dataset.storynav;
    const SEC=['sec-jw','sec-gd','sec-colet','sec-craft','sec-news'];
    setState({page:'story', storyTab:i});
    requestAnimationFrame(()=>{ const el=document.getElementById(SEC[i]); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); });
    return;
  }
  if(t.dataset.news!==undefined) return setState({page:'news', news:t.dataset.news});
  if(t.dataset.project!==undefined) return setState({page:'project', project:t.dataset.project});
  if(t.dataset.filter!==undefined) return setState({filter:t.dataset.filter, sub:firstSub(t.dataset.filter)});
  if(t.dataset.sub!==undefined) return setState({sub:t.dataset.sub});
  if(t.dataset.storytab!==undefined){
    const i=+t.dataset.storytab;
    const SEC=['sec-jw','sec-gd','sec-colet','sec-craft','sec-news'];
    setState({storyTab:i}, true);
    const el=document.getElementById(SEC[i]); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  if(t.dataset.contacttab!==undefined) return setState({contactTab:+t.dataset.contacttab});
});
render();
</script>
